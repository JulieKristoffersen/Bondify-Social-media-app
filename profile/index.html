<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile - Bondify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50 flex flex-col items-center min-h-screen">
  <header class="bg-gradient-to-r from-teal-500 via-cyan-600 to-sky-500 w-full shadow-md">
    <nav class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/profile" class="flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="w-16 h-16">
          <path d="M10,60 A50,50 0 1,1 110,60" fill="#00bcd4" />
          <text x="50%" y="50%" text-anchor="middle" dy=".3em" font-size="20" font-weight="bold" fill="white" font-family="Verdana, sans-serif">Bondify</text>
        </svg>
      </a>
      <button id="menu-btn" class="md:hidden text-3xl text-white">☰</button>
      <ul class="hidden md:flex space-x-6">
        <li><a href="/feed" class="text-white">Feed</a></li>
        <li><a href="/profile" class="text-white">Profile</a></li>
      </ul>
    </nav>
    <div id="mobile-menu" class="hidden md:hidden bg-gray-100 py-3 text-center">
      <a href="/feed" class="block py-2 text-gray-700 hover:text-teal-500">Feed</a>
      <a href="/profile" class="block py-2 text-gray-700 hover:text-teal-500">Profile</a>
    </div>
  </header>

  <main class="min-h-screen flex justify-center p-4 w-full">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg p-6 relative w-full flex flex-col sm:flex-row gap-6">
      <section class="flex flex-col items-center w-full sm:w-1/3 bg-white rounded-lg p-6 shadow-md border-4 border-teal-500">
        <img
          id="profileImg"
          src="../images/profile.png"
          alt="Profile Image"
          class="rounded-full w-32 h-32 object-cover ring-4 ring-teal-500 shadow-lg"
        />
        <h2 id="username" class="mt-4 text-2xl font-semibold text-gray-800 text-center">Username</h2>
        <p id="email" class="text-gray-600 text-center"></p>

        <button
          id="followButton"
          class="mt-4 px-6 py-2 rounded-full bg-teal-500 text-white hover:bg-teal-600 transition flex items-center gap-2"
        >
          <i class="fa-solid fa-user-plus"></i> Follow
        </button>
        <button id="logout-btn" class="px-4 py-2 bg-red-600 text-white rounded mt-4">Log out</button>
        <div class="mt-6 w-full">
          <div class="flex justify-around text-center text-gray-700">
            <div>
              <p id="followersCount" class="text-xl font-bold">120</p>
              <p class="text-sm">Followers</p>
            </div>
            <div>
              <p id="followingCount" class="text-xl font-bold">89</p>
              <p class="text-sm">Following</p>
            </div>
          </div>
        </div>
      </section>

      <section class="flex-1 flex flex-col">
        <button id="show-post-form-btn" class="mb-4 bg-teal-500 hover:bg-teal-600 text-white font-medium py-2 px-4 rounded self-start">+ Add a new post</button>

        <form id="post-form" class="mb-6 hidden flex flex-col gap-3">
          <h3 id="form-title" class="text-xl font-semibold">Add a new post</h3>
          <input type="text" id="post-title" placeholder="Title" required class="border border-gray-300 p-2 rounded" />
          <textarea id="post-body" placeholder="Text" required class="border border-gray-300 p-2 rounded"></textarea>
          <input type="url" id="post-media" placeholder="Picture URL (optional)" class="border border-gray-300 p-2 rounded" />
          <div class="flex space-x-2">
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Save post</button>
            <button type="button" id="cancel-edit" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hidden hover:bg-gray-400">Cancel</button>
          </div>
        </form>

        <section>
          <h3 class="text-2xl font-semibold text-gray-800 mb-4">Your posts</h3>
          <div id="user-posts" class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3"></div>
          <p id="noResults" class="hidden text-center text-gray-500 mt-4">No posts</p>
        </section>
      </section>

      <div
        id="popup"
        class="hidden fixed top-0 left-0 w-screen h-screen bg-gray-700 bg-opacity-80 flex items-center justify-center z-50"
      >
        <div
          id="editPostForm"
          class="bg-white rounded-lg shadow-lg p-8 w-96 h-auto"
        >
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold">Edit Post</h2>
            <button
              id="closePopupBtn"
              class="text-gray-500 hover:text-gray-800"
            >
              <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
          </div>

          <input
            id="editPostTitle"
            type="text"
            placeholder="Title"
            class="border border-teal-600 rounded-lg p-2 w-full h-10 my-2 focus:outline-none focus:ring focus:border-teal-400"
          />
          <textarea
            id="editPostBody"
            placeholder="Enter text..."
            class="border border-teal-600 rounded-lg p-2 w-full min-h-[100px] my-2 focus:outline-none focus:ring focus:border-teal-400"
          ></textarea>
          <input
            id="editPostMedia"
            type="url"
            placeholder="Image URL"
            class="border border-teal-600 rounded-lg p-2 w-full my-2 focus:outline-none focus:ring focus:border-teal-400"
          />
          <div class="flex justify-between">
            <button
              id="savePostBtn"
              class="bg-teal-600 text-white rounded px-4 py-2 hover:bg-teal-700"
            >
              Save
            </button>
            <button
              id="deletePostBtn"
              class="bg-red-600 text-white rounded px-4 py-2 hover:bg-red-700"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/profile.js"></script>

</body>
</html>
