<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="description" content="View a single post on Bondify" />
  <title>View Post - Bondify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="../js/single-post.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <header class="bg-gradient-to-r from-teal-500 via-cyan-600 to-sky-500 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/" class="flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="w-12 h-12">
          <path d="M10,60 A50,50 0 1,1 110,60" fill="#00bcd4" />
          <text x="50%" y="50%" text-anchor="middle" dy=".3em" font-size="20" font-weight="bold" fill="white" font-family="Verdana, sans-serif">
            Bondify
          </text>
        </svg>
      </a>
      <nav>
        <ul class="hidden md:flex space-x-6 text-white font-medium">
          <li><a href="/feed.html" class="hover:text-teal-300">Feed</a></li>
          <li><a href="/profile.html" class="hover:text-teal-300">Profile</a></li>
        </ul>
        <button id="menu-btn" class="md:hidden text-3xl" aria-label="Open menu">&#9776;</button>
      </nav>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-white text-gray-800 text-center py-2">
      <a href="/feed.html" class="block py-2 hover:text-teal-500">Feed</a>
      <a href="/profile.html" class="block py-2 hover:text-teal-500">Profile</a>
    </div>
  </header>

  <main class="flex-grow container mx-auto px-4 py-10 max-w-3xl">
    <section id="post-details" class="bg-white p-8 rounded-lg shadow-lg">
      <p class="text-center text-gray-500">Laster innlegg...</p>
    </section>
  </main>

  <footer class="bg-gradient-to-r from-teal-500 via-cyan-600 to-sky-500 text-white text-center py-4 mt-auto">
    <p>&copy; 2025 Bondify. All rights reserved.</p>
  </footer>

  <script type="module" src="js/post.js"></script>
</body>
</html>
